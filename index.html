<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô de Sinais - Crypto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- cabeçalho -->
        <div class="header">
            <div class="status-area">
                <span class="status-dot connecting" id="statusDot"></span>
                <span id="statusText">Conectando…</span>
            </div>
            <div class="live-badge">
                <span class="live-dot" id="liveDot"></span>
                <span id="liveText">INICIANDO</span>
            </div>
            <div class="price-display" id="priceDisplay">0.00</div>
        </div>

        <!-- card de sinal -->
        <div class="signal-card wait" id="signalCard">
            <div class="signal-value wait" id="signalValue">ESPERAR</div>
            <div class="signal-arrow wait" id="signalArrow">—</div>
            <div class="score-area">
                <div class="score-label">CONFIANÇA</div>
                <div class="score-number" id="scoreText">0%</div>
                <div class="score-bar-bg">
                    <div class="score-bar-fill wait" id="scoreBar" style="width:0%"></div>
                </div>
            </div>
        </div>

        <!-- indicadores -->
        <div class="indicators">
            <div class="ind-item">
                <div class="ind-label">EMA (9)</div>
                <div class="ind-value" id="emaVal">--</div>
                <div class="ind-sub" id="emaSub">--</div>
            </div>
            <div class="ind-item">
                <div class="ind-label">VWAP (20)</div>
                <div class="ind-value" id="vwapVal">--</div>
                <div class="ind-sub" id="vwapSub">--</div>
            </div>
            <div class="ind-item">
                <div class="ind-label">Volume Rel.</div>
                <div class="ind-value" id="volVal">--</div>
                <div class="ind-sub" id="volSub">--</div>
            </div>
            <div class="ind-item">
                <div class="ind-label">Força da Vela</div>
                <div class="ind-value" id="forcaVal">--</div>
                <div class="ind-sub" id="forcaSub">--</div>
            </div>
        </div>

        <!-- histórico -->
        <div class="history-title">
            <span>Últimos Sinais</span>
            <span id="updateTime">--</span>
        </div>
        <div class="history-list" id="historyList"></div>

        <!-- timer -->
        <div class="timer-area">
            <span>Próximo candle:</span>
            <span id="timer">5:00</span>
        </div>

        <div class="error-msg" id="errorMsg">⚠️ Sem dados – verifique o símbolo</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
